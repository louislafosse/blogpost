<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Fira+Code:wght@300;400&family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/fonts.min.css">
    <title>Not Secret Club</title>
    <script>
      // Recover path from GitHub Pages 404 redirect
      (function () {
        var search = window.location.search;
        if (search) {
          var p = decodeURIComponent(search.slice(3));
          // Preserve the base path (e.g. /blogpost) so React Router basename is honoured
          var base = window.location.pathname.replace(/\/$/, '');
          window.history.replaceState(null, null, base + p);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
